name: Custom JavaScript Action

on:
  workflow_dispatch:

jobs:
  use-custom-action:
    runs-on: ubuntu-latest
    steps:
      - name: Run my custom action
        id: hello
        uses: Mustafa-bangash/hello-custom-action@v1.0.0
        with:
          who-to-greet: 'Mustafa Bangash'

      - name: Show the action outputs
        run: |
          echo "Greeting output - ${{ steps.hello.outputs.greeting }}"
          echo "Time output - ${{ steps.hello.outputs.time }}"